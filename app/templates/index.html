<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboCode Challenge - Arena Gamificada de Python</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0a0d14',
                            card: '#121824',
                            border: '#1f293d',
                            accent: '#00ffcc',
                            purple: '#a855f7',
                            pink: '#ec4899',
                            yellow: '#eab308'
                        }
                    },
                    fontFamily: {
                        mono: ['Fira Code', 'Courier New', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome / Lucide Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for Level Up & Victory -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- React 18 UMD & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #0a0d14;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 255, 204, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.05) 0%, transparent 40%);
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            border: 1px solid rgba(0, 255, 204, 0.4);
        }
        .neon-border-purple {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
        }
        .neon-border-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0a0d14;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #00ffcc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const AVATARS = [
            // 🤖 Robôs (bottts)
            { id: "robot-cyber",   url: "https://api.dicebear.com/9.x/bottts/svg?seed=CyberBot&backgroundColor=0ea5e9",    name: "Cyber Bot",    color: "from-cyan-500 to-blue-600" },
            { id: "boss-mech",     url: "https://api.dicebear.com/9.x/bottts/svg?seed=BossMech&backgroundColor=f59e0b",    name: "Boss Mech",    color: "from-amber-400 to-orange-600" },
            { id: "quantum-ai",    url: "https://api.dicebear.com/9.x/bottts/svg?seed=QuantumAI&backgroundColor=10b981",   name: "Quantum AI",   color: "from-emerald-400 to-teal-600" },
            { id: "flame-bot",     url: "https://api.dicebear.com/9.x/bottts/svg?seed=FlameBot&backgroundColor=ef4444",    name: "Flame Bot",    color: "from-orange-400 to-red-600" },
            { id: "neon-bot",      url: "https://api.dicebear.com/9.x/bottts/svg?seed=NeonBot&backgroundColor=eab308",     name: "Neon Bot",     color: "from-yellow-300 to-amber-500" },
            { id: "cryo-bot",      url: "https://api.dicebear.com/9.x/bottts/svg?seed=CryoBot&backgroundColor=38bdf8",     name: "Cryo Bot",     color: "from-blue-300 to-cyan-600" },
            { id: "virus-bot",     url: "https://api.dicebear.com/9.x/bottts/svg?seed=VirusBot&backgroundColor=ec4899",    name: "Virus Bot",    color: "from-red-500 to-pink-600" },
            { id: "matrix-bot",    url: "https://api.dicebear.com/9.x/bottts/svg?seed=MatrixBot&backgroundColor=16a34a",   name: "Matrix Bot",   color: "from-green-400 to-emerald-700" },
            // 🧑 Caricaturas (adventurer)
            { id: "hacker-ninja",  url: "https://api.dicebear.com/9.x/adventurer/svg?seed=HackerNinja&backgroundColor=7c3aed",  name: "Hacker",    color: "from-purple-500 to-indigo-600" },
            { id: "code-wizard",   url: "https://api.dicebear.com/9.x/adventurer/svg?seed=CodeWizard&backgroundColor=db2777",   name: "Mago",      color: "from-pink-500 to-rose-600" },
            { id: "space-ranger",  url: "https://api.dicebear.com/9.x/adventurer/svg?seed=SpaceRanger&backgroundColor=6366f1",  name: "Ranger",    color: "from-sky-400 to-indigo-500" },
            { id: "data-samurai",  url: "https://api.dicebear.com/9.x/adventurer/svg?seed=DataSamurai&backgroundColor=64748b",  name: "Samurai",   color: "from-slate-400 to-gray-700" },
            { id: "bio-hacker",    url: "https://api.dicebear.com/9.x/adventurer/svg?seed=BioHacker&backgroundColor=65a30d",    name: "Bio Hack",  color: "from-lime-400 to-green-600" },
            { id: "pixel-ghost",   url: "https://api.dicebear.com/9.x/adventurer/svg?seed=PixelGhost&backgroundColor=8b5cf6",   name: "Ghost",     color: "from-violet-400 to-purple-700" },
            { id: "robo-skull",    url: "https://api.dicebear.com/9.x/adventurer/svg?seed=RoboSkull&backgroundColor=be123c",    name: "Crânio",    color: "from-rose-500 to-red-800" },
        ];

        function App() {
            const [token, setToken] = useState(localStorage.getItem('robocode_token') || '');
            const [user, setUser] = useState(null);
            const [view, setView] = useState('map'); // 'auth', 'map', 'arena', 'leaderboard', 'admin'
            const [activities, setActivities] = useState([]);
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [leaderboard, setLeaderboard] = useState([]);
            const [loading, setLoading] = useState(false);

            const [classrooms, setClassrooms] = useState([]);
            const [selectedClassroomId, setSelectedClassroomId] = useState(''); // Para filtro no ranking
            
            // Auth State
            const [authTab, setAuthTab] = useState('login');
            const [authForm, setAuthForm] = useState({ username: '', password: '', avatar: 'robot-cyber', classroom_id: '' });
            const [authError, setAuthError] = useState('');
            const [updateForm, setUpdateForm] = useState({ username: '', current_password: '', new_password: '', confirm_password: '', avatar: 'robot-cyber', classroom_id: '' });
            const [updateSuccess, setUpdateSuccess] = useState('');


            // Arena State
            const [userCode, setUserCode] = useState('');
            const [customInput, setCustomInput] = useState('');
            const [runOutput, setRunOutput] = useState(null);
            const [submitResults, setSubmitResults] = useState(null);
            const [levelUpModal, setLevelUpModal] = useState(null);

            // Admin State
            const [networkInfo, setNetworkInfo] = useState(null);
            const [copiedLink, setCopiedLink] = useState(false);
            const [activityModal, setActivityModal] = useState(null); // null or { isEdit: bool, data: obj }
            const [testCasesModal, setTestCasesModal] = useState(null); // null or { activityId: int, testCases: [] }
            const [solutionTestResult, setSolutionTestResult] = useState(null);
            const [activityForm, setActivityForm] = useState({
                phase: 1, title: '', description: '', difficulty: 'EASY', xp_reward: 100, initial_code: '# Escreva seu código em Python aqui\n', input_data: '', expected_output: ''
            });
            const [tcForm, setTcForm] = useState({ input_data: '', expected_output: '', is_hidden: false });
            
            // Admin Classroom State
            const [classroomModal, setClassroomModal] = useState(null); // null or { isEdit: bool, id: int }
            const [classroomForm, setClassroomForm] = useState({ name: '', code: '', description: '' });

            useEffect(() => {
                if (token) {
                    fetchMe();
                    fetchActivities();
                    fetchClassrooms();
                } else {
                    setView('auth');
                    fetchClassrooms(); // Necessário para o select do cadastro
                }
            }, [token]);

            useEffect(() => {
                if (view === 'admin' && user && user.is_admin) {
                    fetchNetworkInfo();
                }
            }, [view, user]);

            const apiFetch = async (url, options = {}, customToken = null) => {
                const headers = { 'Content-Type': 'application/json', ...options.headers };
                const authToken = customToken || token || localStorage.getItem('robocode_token');
                if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
                const res = await fetch(url, { ...options, headers });
                if (res.status === 401) {
                    logout();
                    throw new Error('Sessão expirada');
                }
                const data = await res.json();
                if (!res.ok) {
                    let msg = 'Erro na requisição';
                    if (typeof data.detail === 'string') {
                        msg = data.detail;
                    } else if (Array.isArray(data.detail)) {
                        msg = data.detail.map(d => typeof d === 'string' ? d : (d.msg || JSON.stringify(d))).join(', ');
                    } else if (data.detail && typeof data.detail === 'object') {
                        msg = data.detail.msg || JSON.stringify(data.detail);
                    }
                    throw new Error(msg);
                }
                return data;
            };

            const fetchMe = async (authToken = null) => {
                try {
                    const data = await apiFetch('/api/auth/me', {}, authToken);
                    setUser(data);
                } catch (e) {
                    console.error(e);
                }
            };

            const fetchClassrooms = async (authToken = null) => {
                try {
                    const data = await apiFetch('/api/classrooms', {}, authToken);
                    setClassrooms(data);
                } catch (e) {
                    console.error(e);
                }
            };

            const fetchActivities = async (authToken = null) => {
                try {
                    const data = await apiFetch('/api/activities', {}, authToken);
                    setActivities(data);
                } catch (e) {
                    console.error(e);
                }
            };

            const fetchLeaderboard = async (authToken = null, classId = null) => {
                try {
                    let url = '/api/leaderboard';
                    
                    let filterId = classId;
                    // Se não for passado classId explícito, e for um aluno (não-admin), filtra para a turma dele
                    if (filterId === null) {
                        if (user && !user.is_admin && user.classroom_id) {
                            filterId = user.classroom_id;
                        } else {
                            filterId = ''; 
                        }
                    }

                    if (filterId) url += `?classroom_id=${filterId}`;
                    const data = await apiFetch(url, {}, authToken);
                    setLeaderboard(data);
                } catch (e) {
                    console.error(e);
                }
            };

            const fetchNetworkInfo = async (authToken = null) => {
                try {
                    const data = await apiFetch('/api/admin/network-info', {}, authToken);
                    setNetworkInfo(data);
                } catch (e) {
                    console.error(e);
                }
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                setLoading(true);
                try {
                    const endpoint = authTab === 'login' ? '/api/auth/login' : '/api/auth/register';
                    const payload = authTab === 'login' 
                        ? { username: authForm.username, password: authForm.password }
                        : { username: authForm.username, password: authForm.password, avatar: authForm.avatar, classroom_id: authForm.classroom_id ? parseInt(authForm.classroom_id) : null };
                    
                    const data = await apiFetch(endpoint, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    localStorage.setItem('robocode_token', data.access_token);
                    setToken(data.access_token);
                    setUser(data.user);
                    setView(data.user.is_admin ? 'admin' : 'map');
                    await fetchActivities(data.access_token);
                    if (data.user.is_admin) await fetchNetworkInfo(data.access_token);
                } catch (err) {
                    setAuthError(err.message);
                } finally {
                    setLoading(false);
                }
            };
            const handleUpdate = async (e) => {
                e.preventDefault();
                setAuthError('');
                setUpdateSuccess('');
                if (updateForm.new_password && updateForm.new_password !== updateForm.confirm_password) {
                    setAuthError('As senhas novas não coincidem!');
                    return;
                }
                setLoading(true);
                try {
                    const payload = {
                        username: updateForm.username,
                        current_password: updateForm.current_password,
                        new_password: updateForm.new_password || null,
                        avatar: updateForm.avatar || null,
                        classroom_id: updateForm.classroom_id ? parseInt(updateForm.classroom_id) : null
                    };
                    const data = await apiFetch('/api/auth/update', {
                        method: 'PUT',
                        body: JSON.stringify(payload)
                    });
                    localStorage.setItem('robocode_token', data.access_token);
                    setToken(data.access_token);
                    setUser(data.user);
                    setUpdateSuccess('✅ Dados atualizados com sucesso! Redirecionando...');
                    setTimeout(() => {
                        setView(data.user.is_admin ? 'admin' : 'map');
                        setUpdateSuccess('');
                    }, 1500);
                } catch (err) {
                    setAuthError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const logout = () => {
                localStorage.removeItem('robocode_token');
                setToken('');
                setUser(null);
                setView('auth');
            };

            const openActivity = async (activityId) => {
                setLoading(true);
                try {
                    const detail = await apiFetch(`/api/activities/${activityId}`);
                    setSelectedActivity(detail);
                    setUserCode(detail.initial_code);
                    setCustomInput(detail.test_cases && detail.test_cases.length > 0 ? detail.test_cases[0].input_data : '');
                    setRunOutput(null);
                    setSubmitResults(null);
                    setView('arena');
                } catch (e) {
                    alert('Erro ao carregar atividade: ' + e.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleRunCode = async () => {
                setLoading(true);
                setRunOutput(null);
                setSubmitResults(null);
                try {
                    const res = await apiFetch('/api/activities/submit', {
                        method: 'POST',
                        body: JSON.stringify({ activity_id: selectedActivity.id, code: userCode })
                    });
                    setSubmitResults(res);

                    if (res.passed) {
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                        fetchMe();
                        fetchActivities();
                        fetchLeaderboard();

                        if (res.leveled_up) {
                            setLevelUpModal({ level: res.new_level, xp: res.new_xp });
                        }
                    }
                } catch (e) {
                    setRunOutput({ output: '', error: e.message, execution_time_ms: 0 });
                } finally {
                    setLoading(false);
                }
            };

            const handleExecuteCode = async () => {
                setLoading(true);
                setRunOutput(null);
                setSubmitResults(null);
                try {
                    const res = await apiFetch('/api/activities/run', {
                        method: 'POST',
                        body: JSON.stringify({ code: userCode, input_data: customInput })
                    });
                    setRunOutput(res);
                } catch (e) {
                    setRunOutput({ output: '', error: e.message, execution_time_ms: 0 });
                } finally {
                    setLoading(false);
                }
            };


            const openLeaderboardView = () => {
                setSelectedClassroomId('');
                fetchLeaderboard(null, '');
                setView('leaderboard');
            };

            // ----------------------------------------------------
            // ADMIN ACTIONS
            // ----------------------------------------------------
            const openCreateActivityModal = () => {
                setActivityForm({
                    phase: activities.length + 1,
                    title: '',
                    description: '',
                    difficulty: 'EASY',
                    xp_reward: 100,
                    initial_code: '# Escreva seu código em Python aqui\n',
                    input_data: '',
                    expected_output: ''
                });
                setActivityModal({ isEdit: false, id: null });
            };

            const openEditActivityModal = async (act) => {
                setLoading(true);
                try {
                    const fullAct = await apiFetch(`/api/admin/activities/${act.id}/full`);
                    setActivityForm({
                        phase: fullAct.phase,
                        title: fullAct.title,
                        description: fullAct.description,
                        difficulty: fullAct.difficulty,
                        xp_reward: fullAct.xp_reward,
                        initial_code: fullAct.initial_code || '# Escreva seu código em Python aqui\n',
                        input_data: (fullAct.test_cases && fullAct.test_cases.length > 0) ? fullAct.test_cases[0].input_data : '',
                        expected_output: (fullAct.test_cases && fullAct.test_cases.length > 0) ? fullAct.test_cases[0].expected_output : ''
                    });
                    setActivityModal({ isEdit: true, id: fullAct.id });
                } catch (err) {
                    alert('Erro ao carregar detalhes da atividade: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleTestSolution = async (activityId) => {
                setLoading(true);
                try {
                    const res = await apiFetch(`/api/admin/activities/${activityId}/test-solution`, { method: 'POST' });
                    setSolutionTestResult(res);
                } catch (err) {
                    alert('Erro ao testar gabarito: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleGenerateOutputFromSolution = async () => {
                if (!testCasesModal) return;
                setLoading(true);
                try {
                    const fullAct = await apiFetch(`/api/admin/activities/${testCasesModal.activityId}/full`);
                    if (!fullAct.solution_code) {
                        alert('Esta atividade ainda não possui um Código Gabarito cadastrado! Edite a atividade para adicionar.');
                        return;
                    }
                    const res = await apiFetch('/api/admin/generate-output', {
                        method: 'POST',
                        body: JSON.stringify({ code: fullAct.solution_code, input_data: tcForm.input_data })
                    });
                    setTcForm(prev => ({ ...prev, expected_output: res.output }));
                } catch (err) {
                    alert('Erro ao gerar saída pelo gabarito: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleSaveActivity = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    if (activityModal.isEdit) {
                        await apiFetch(`/api/admin/activities/${activityModal.id}`, {
                            method: 'PUT',
                            body: JSON.stringify(activityForm)
                        });
                    } else {
                        await apiFetch('/api/admin/activities', {
                            method: 'POST',
                            body: JSON.stringify(activityForm)
                        });
                    }
                    setActivityModal(null);
                    fetchActivities();
                } catch (err) {
                    alert('Erro ao salvar atividade: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteActivity = async (activityId) => {
                if (!confirm('Tem certeza que deseja excluir esta atividade? Todo o histórico de submissões será removido.')) return;
                setLoading(true);
                try {
                    await apiFetch(`/api/admin/activities/${activityId}`, { method: 'DELETE' });
                    fetchActivities();
                } catch (err) {
                    alert('Erro ao excluir atividade: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const openManageTestCases = async (activityId) => {
                setLoading(true);
                try {
                    const detail = await apiFetch(`/api/admin/activities/${activityId}/full`);
                    setTestCasesModal({ activityId, activityTitle: detail.title, testCases: detail.test_cases });
                    setTcForm({ input_data: '', expected_output: '', is_hidden: false });
                } catch (err) {
                    alert('Erro ao carregar casos de teste: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleAddTestCase = async (e) => {
                e.preventDefault();
                if (!tcForm.expected_output.trim()) {
                    alert('A saída esperada é obrigatória!');
                    return;
                }
                setLoading(true);
                try {
                    const newTc = await apiFetch(`/api/admin/activities/${testCasesModal.activityId}/test-cases`, {
                        method: 'POST',
                        body: JSON.stringify(tcForm)
                    });
                    setTestCasesModal({
                        ...testCasesModal,
                        testCases: [...testCasesModal.testCases, newTc]
                    });
                    setTcForm({ input_data: '', expected_output: '', is_hidden: false });
                } catch (err) {
                    alert('Erro ao adicionar caso de teste: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteTestCase = async (tcId) => {
                setLoading(true);
                try {
                    await apiFetch(`/api/admin/test-cases/${tcId}`, { method: 'DELETE' });
                    setTestCasesModal({
                        ...testCasesModal,
                        testCases: testCasesModal.testCases.filter(t => t.id !== tcId)
                    });
                } catch (err) {
                    alert('Erro ao remover caso de teste: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const getAvatarInfo = (avatarId) => AVATARS.find(a => a.id === avatarId) || AVATARS[0];

            return (
                <div class="flex flex-col min-h-screen">
                    {/* HUD / HEADER */}
                    <header class="bg-cyber-card border-b border-cyber-border sticky top-0 z-40 px-6 py-3 shadow-lg flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-3 cursor-pointer" onClick={() => user ? setView('map') : setView('auth')}>
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center text-white text-xl shadow-lg neon-border">
                                <i class="fa-solid fa-robot"></i>
                            </div>
                            <div>
                                <h1 class="text-lg font-black tracking-wider text-cyan-400 font-mono">ROBO<span class="text-purple-400">CODE</span></h1>
                                <p class="text-xs text-gray-400">Challenge Arena Python</p>
                            </div>
                        </div>

                        {user && (
                            <div class="flex items-center gap-6">
                                {/* HUD STATUS DO ALUNO OU BADGE ADMIN */}
                                <div class="hidden sm:flex items-center gap-4 bg-cyber-bg px-4 py-2 rounded-xl border border-cyber-border">
                                    <div class="flex items-center gap-2">
                                        <div class={`w-8 h-8 rounded-lg bg-gradient-to-br ${getAvatarInfo(user.avatar).color} flex items-center justify-center overflow-hidden`}>
                                            <img src={getAvatarInfo(user.avatar).url} alt={getAvatarInfo(user.avatar).name} class="w-full h-full object-contain" />
                                        </div>
                                        <div>
                                            <div class="flex items-center gap-2">
                                                <p class="text-xs font-bold text-gray-200">{user.name}</p>
                                                {user.is_admin && (
                                                    <span class="text-[9px] bg-red-500/20 text-red-400 font-black px-1.5 py-0.5 rounded border border-red-500/40 uppercase">
                                                        ADMIN
                                                    </span>
                                                )}
                                            </div>
                                            <div class="flex items-center gap-1">
                                                <span class="text-[10px] bg-purple-900/60 text-purple-300 font-bold px-1.5 py-0.5 rounded border border-purple-500/40">
                                                    Nível {user.level}
                                                </span>
                                                {user.classroom_code && (
                                                    <span class="text-[10px] bg-cyan-900/60 text-cyan-300 font-bold px-1.5 py-0.5 rounded border border-cyan-500/40" title={user.classroom_name}>
                                                        <i class="fa-solid fa-users text-[9px] mr-1"></i>{user.classroom_code}
                                                    </span>
                                                )}
                                                <span class="text-xs text-yellow-400 font-mono font-bold">

{!runOutput && !submitResults && (

                                                            act.difficulty === 'HARD' ? 'bg-orange-950/60 text-orange-400 border-orange-500/40' :
                                                            act.difficulty === 'MEDIUM' ? 'bg-yellow-950/60 text-yellow-400 border-yellow-500/40' :

                                                    </td>

                                                        <button 
                                                            onClick={() => handleTestSolution(act.id)}

                                                            <i class="fa-solid fa-vial mr-1"></i> Testes
                                                        </button>
                                                        <button

                                                            <i class="fa-solid fa-pen-to-square mr-1"></i> Editar
                                                        </button>
                                                        <button 
                                                            onClick={() => handleDeleteActivity(act.id)}

                    </main>

                    {/* MODAL CRIAR / EDITAR TURMA (ADMIN) */}
                    {classroomModal && (
                        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div class="bg-cyber-card border border-cyber-border rounded-2xl p-6 max-w-md w-full shadow-2xl">
                                <div class="flex items-center justify-between mb-4 pb-3 border-b border-cyber-border">

                                        <i class="fa-solid fa-users text-cyan-400"></i>
                                        {classroomModal.isEdit ? 'Editar Turma' : 'Nova Turma'}

                                    <button onClick={() => setClassroomModal(null)} class="text-gray-400 hover:text-white">
                                        <i class="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                    e.preventDefault();
                                    setLoading(true);
                                    try {
                                        if (classroomModal.isEdit) {
                                            await apiFetch(`/api/admin/classrooms/${classroomModal.id}`, { method: 'PUT', body: JSON.stringify(classroomForm) });
                                        } else {
                                            await apiFetch('/api/admin/classrooms', { method: 'POST', body: JSON.stringify(classroomForm) });
                                        }
                                        setClassroomModal(null);
                                        fetchClassrooms();
                                    } catch (err) {
                                        alert(err.message);
                                    } finally {
                                        setLoading(false);
                                    }
                                }} class="space-y-4">

                                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Nome da Turma</label>

                                            type="text" 
                                            required 
                                            placeholder="Ex: Turma A / 3ºA Info"
                                            class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-sm text-white"
                                            value={classroomForm.name}
                                            onChange={e => setClassroomForm({...classroomForm, name: e.target.value})}
                                        />
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Código da Turma</label>
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="Ex: 3A-2026"
                                            class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-sm text-white font-mono"
                                            value={classroomForm.code}
                                            onChange={e => setClassroomForm({...classroomForm, code: e.target.value})}
                                        />

                                    <div>
                                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Descrição (Opcional)</label>
                                        <textarea 
                                            rows="2" 
                                            class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-sm text-white"
                                            value={classroomForm.description}
                                            onChange={e => setClassroomForm({...classroomForm, description: e.target.value})}
                                        ></textarea>
                                    </div>

                                    <div class="flex items-center justify-end gap-3 pt-3 border-t border-cyber-border">
                                        <button 
                                            type="button" 
                                            onClick={() => setClassroomModal(null)}
                                            class="px-4 py-2 bg-gray-800 text-gray-400 rounded-xl text-sm font-bold hover:text-white"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit" 
                                            disabled={loading}
                                            class="px-5 py-2 bg-cyan-500 text-slate-950 font-black rounded-xl text-sm shadow-md"
                                        >
                                            {loading ? <i class="fa-solid fa-circle-notch fa-spin"></i> : 'SALVAR'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL CRIAR / EDITAR ATIVIDADE (ADMIN) */}
                    {activityModal && (
                        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">

                                <div class="flex items-center justify-between mb-4 pb-3 border-b border-cyber-border">
                                    <h3 class="text-lg font-black text-white flex items-center gap-2">
                                        <i class="fa-solid fa-pen-to-square text-cyan-400"></i>
                                        {activityModal.isEdit ? 'Editar Atividade / Pontuação' : 'Nova Atividade'}
                                    </h3>
                                    <button onClick={() => setActivityModal(null)} class="text-gray-400 hover:text-white">
                                        <i class="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveActivity} class="space-y-4">
                                    <div class="grid grid-cols-3 gap-4">

                                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Fase N°</label>

                                                required 
                                                min="1"

                                                onChange={e => setActivityForm({...activityForm, phase: parseInt(e.target.value)})}
                                            />
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Pontuação (XP)</label>

                                                type="number" 
                                                required 
                                                min="10"
                                                step="10"
                                                class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-sm text-yellow-400 font-mono font-bold"
                                                value={activityForm.xp_reward}
                                                onChange={e => setActivityForm({...activityForm, xp_reward: parseInt(e.target.value)})}
                                            />
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Dificuldade</label>
                                            <select 
                                                class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-sm text-white font-mono"
                                                value={activityForm.difficulty}
                                                onChange={e => setActivityForm({...activityForm, difficulty: e.target.value})}
                                            >
                                                <option value="EASY">EASY</option>
                                                <option value="MEDIUM">MEDIUM</option>
                                                <option value="HARD">HARD</option>
                                                <option value="BOSS">BOSS</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Título da Atividade</label>
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="Ex: Fase 1: Hello World Python"
                                            class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-sm text-white"
                                            value={activityForm.title}
                                            onChange={e => setActivityForm({...activityForm, title: e.target.value})}
                                        />

                                    <div>
                                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Enunciado / Instruções</label>

                                            rows="4" 
                                            required 
                                            placeholder="Descreva o objetivo da atividade e o que o aluno deve fazer..."
                                            class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-3 text-xs text-white"
                                            value={activityForm.description}
                                            onChange={e => setActivityForm({...activityForm, description: e.target.value})}
                                        ></textarea>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Código Modelo / Inicial (Python)</label>

                                            rows="3" 
                                            class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-3 text-xs text-cyan-300 font-mono"
                                            value={activityForm.initial_code}
                                            onChange={e => setActivityForm({...activityForm, initial_code: e.target.value})}
                                        ></textarea>
                                    </div>

                                     <div class="p-3 bg-cyber-bg rounded-xl border border-cyan-500/40 space-y-2">

                                                 <i class="fa-solid fa-terminal"></i> Entrada (stdin)
                                             </label>
                                         </div>
                                         <p class="text-[11px] text-gray-400">

                                         </p>
                                         <textarea

                                             placeholder="Ex: 10&#10;20"

                                             value={activityForm.input_data}
                                             onChange={e => setActivityForm({...activityForm, input_data: e.target.value})}
                                         ></textarea>
                                     </div>

                                     <div class="p-3 bg-cyber-bg rounded-xl border border-emerald-500/40 space-y-2 mt-3">
                                         <div class="flex items-center justify-between">
                                             <label class="block text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1.5 font-mono">
                                                 <i class="fa-solid fa-check-double"></i> Saída Esperada
                                             </label>
                                         </div>
                                         <p class="text-[11px] text-gray-400">

                                         </p>
                                         <textarea
                                             rows="3"
                                             placeholder="Ex: Energia total: 30"
                                             class="w-full bg-cyber-card border border-emerald-500/40 rounded-xl p-3 text-xs text-emerald-300 font-mono focus:outline-none focus:border-emerald-400"
                                             value={activityForm.expected_output}
                                             onChange={e => setActivityForm({...activityForm, expected_output: e.target.value})}
                                         ></textarea>
                                     </div>

                                    <div class="flex items-center justify-end gap-3 pt-3 border-t border-cyber-border">
                                        <button 
                                            type="button" 
                                            onClick={() => setActivityModal(null)}
                                            class="px-4 py-2 bg-gray-800 text-gray-400 rounded-xl text-sm font-bold hover:text-white"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit" 
                                            disabled={loading}
                                            class="px-5 py-2 bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 font-black rounded-xl text-sm shadow-md"
                                        >
                                            {loading ? <i class="fa-solid fa-circle-notch fa-spin"></i> : 'SALVAR ATIVIDADE'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL RESULTADO TESTE GABARITO (ADMIN) */}
                    {solutionTestResult && (
                        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div class="bg-cyber-card border border-cyber-border rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4">
                                <div class="flex items-center justify-between pb-3 border-b border-cyber-border">
                                    <h3 class="text-lg font-black text-white flex items-center gap-2 font-mono">
                                        <i class="fa-solid fa-vial text-purple-400"></i> Validação do Código Gabarito
                                    </h3>
                                    <button onClick={() => setSolutionTestResult(null)} class="text-gray-400 hover:text-white">
                                        <i class="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <div class={`p-4 rounded-xl border text-xs font-mono ${solutionTestResult.passed ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-300' : 'bg-red-950/40 border-red-500/50 text-red-300'}`}>

                                                <div class="flex items-center justify-between font-bold">
                                                    <span>Caso #{i + 1}</span>
                                                    <span class={r.passed ? 'text-emerald-400' : 'text-red-400'}>
                                                        {r.passed ? 'PASSED ✓' : 'FAILED ✗'}
                                                    </span>
                                                </div>
                                                {r.input_data && <div><span class="text-cyan-400">Entrada (stdin):</span> {r.input_data}</div>}
                                                <div><span class="text-emerald-400">Saída Esperada:</span> {r.expected_output}</div>
                                                <div><span class="text-purple-300">Saída Obtida pelo Gabarito:</span> {r.actual_output}</div>
                                                {r.error && <div class="text-red-400"><span class="font-bold">Erro:</span> {r.error}</div>}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div class="flex justify-end pt-2">
                                    <button 
                                        onClick={() => setSolutionTestResult(null)}
                                        class="px-5 py-2 bg-gray-800 text-white rounded-xl text-xs font-bold hover:bg-gray-700 transition-colors"
                                    >
                                        Fechar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL GERENCIAR CASOS DE TESTE (ADMIN) */}
                    {testCasesModal && (
                        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">

                                <div class="flex items-center justify-between mb-4 pb-3 border-b border-cyber-border">
                                    <h3 class="text-lg font-black text-white flex items-center gap-2">

                                        <i class="fa-solid fa-xmark text-lg"></i>

                                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Entrada (stdin)</label>
                                            <textarea
                                                rows="3"
                                                placeholder="Ex: 10&#10;20"
                                                class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-xs text-white font-mono focus:outline-none focus:border-cyan-400"
                                                value={tcForm.input_data}
                                                onChange={e => setTcForm({...tcForm, input_data: e.target.value})}

                                                    onClick={handleGenerateOutputFromSolution}
                                                    disabled={loading || !tcForm.input_data}
                                                    class="px-2 py-0.5 bg-purple-500/20 text-purple-300 hover:bg-purple-500/30 border border-purple-500/40 rounded-lg text-[10px] font-bold transition-all"
                                                    title="Gerar saída automática pelo gabarito"
                                                >
                                                    {loading ? <i class="fa-solid fa-circle-notch fa-spin"></i> : <i class="fa-solid fa-magic-wand-sparkles mr-0.5"></i>} Gerar
                                                </button>
                                            </label>
                                            <textarea
                                                rows="3"
                                                placeholder="Ex: Energia total: 30"
                                                class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-xs text-emerald-300 font-mono focus:outline-none focus:border-emerald-400"
                                                value={tcForm.expected_output}
                                                onChange={e => setTcForm({...tcForm, expected_output: e.target.value})}
                                            ></textarea>
                                        </div>
                                    </div>

                                    <div class="flex items-center justify-between mb-3">
                                        <label class="flex items-center gap-1.5 text-xs text-gray-400 cursor-pointer">
                                            <input
                                                type="checkbox"
                                                checked={tcForm.is_hidden}
                                                onChange={e => setTcForm({...tcForm, is_hidden: e.target.checked})}
                                                class="w-4 h-4 rounded bg-cyber-bg border-cyber-border text-cyan-500 focus:ring-cyan-500"
                                            />

                                        </label>
                                        <button
                                            type="submit"
                                            disabled={loading || !tcForm.expected_output.trim()}
                                            class="px-4 py-1.5 bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 rounded-lg text-xs font-black hover:opacity-90 transition-opacity disabled:opacity-50"
                                        >
                                            {loading ? <i class="fa-solid fa-circle-notch fa-spin"></i> : <i class="fa-solid fa-plus mr-1"></i>} Adicionar Caso
                                        </button>

                                                            : 'bg-emerald-950/60 text-emerald-400 border-emerald-500/40'
                                                    }`}>
                                                        {tc.is_hidden ? 'Oculto' : 'Público'}
                                                    </span>
                                                </div>
                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-2.5">
                                                    <div>
                                                        <span class="text-xs text-cyan-400 font-bold">Entrada (stdin):</span>
                                                        <pre class="whitespace-pre-wrap bg-black/30 rounded p-2 mt-1 text-xs text-gray-300 font-mono min-h-[40px]">{tc.input_data || '(vazia)'}</pre>
                                                    </div>
                                                    <div>
                                                        <span class="text-xs text-emerald-400 font-bold">Saída Esperada:</span>
                                                        <pre class="whitespace-pre-wrap bg-black/30 rounded p-2 mt-1 text-xs text-emerald-300 font-mono min-h-[40px]">{tc.expected_output || '(vazia)'}</pre>
                                                    </div>
                                                </div>
                                                <button
                                                    onClick={() => handleDeleteTestCase(tc.id)}
                                                    class="px-3 py-1 bg-red-500/20 text-red-400 hover:bg-red-500/30 border border-red-500/40 rounded-lg text-xs font-bold transition-all"
                                                >
                                                    <i class="fa-solid fa-trash mr-1"></i> Excluir Caso
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div class="flex justify-end pt-3 border-t border-cyber-border mt-4">
                                    <button
                                        onClick={() => setTestCasesModal(null)}
                                        class="px-5 py-2 bg-gray-800 text-white rounded-xl text-xs font-bold hover:bg-gray-700 transition-colors"
                                    >
                                        Fechar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL LEVEL UP */}
                    {levelUpModal && (
                        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div class="bg-cyber-card border-2 border-yellow-400 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl neon-border relative overflow-hidden transform animate-bounce-short">
                                <div class="w-20 h-20 bg-gradient-to-tr from-yellow-400 to-amber-600 rounded-full mx-auto flex items-center justify-center text-slate-950 text-4xl shadow-xl mb-4">
                                    <i class="fa-solid fa-angles-up"></i>
                                </div>
                                <h3 class="text-3xl font-black text-yellow-400 tracking-wider font-mono">LEVEL UP!</h3>
                                <p class="text-gray-300 text-sm mt-2">Você subiu para o <strong class="text-white font-mono">Nível {levelUpModal.level}</strong>!</p>
                                <div class="my-4 py-2 bg-cyber-bg rounded-xl border border-cyber-border font-mono text-yellow-400 font-bold text-lg">
                                    <i class="fa-solid fa-bolt mr-2"></i>{levelUpModal.xp} XP Total
                                </div>
                                <button 
                                    onClick={() => setLevelUpModal(null)}
                                    class="w-full py-3 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-black rounded-xl hover:opacity-90 transition-opacity shadow-lg"
                                >
                                    CONTINUAR JOGANDO
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
