<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboCode Challenge - Arena Gamificada de Python</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0a0d14',
                            card: '#121824',
                            border: '#1f293d',
                            accent: '#00ffcc',
                            purple: '#a855f7',
                            pink: '#ec4899',
                            yellow: '#eab308'
                        }
                    },
                    fontFamily: {
                        mono: ['Fira Code', 'Courier New', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome / Lucide Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for Level Up & Victory -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- React 18 UMD & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #0a0d14;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 255, 204, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.05) 0%, transparent 40%);
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            border: 1px solid rgba(0, 255, 204, 0.4);
        }
        .neon-border-purple {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
        }
        .neon-border-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0a0d14;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #00ffcc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const AVATARS = [
            { id: "robot-cyber", icon: "fa-robot", name: "Cyber Bot", color: "from-cyan-500 to-blue-600" },
            { id: "hacker-ninja", icon: "fa-user-ninja", name: "Hacker Ninja", color: "from-purple-500 to-indigo-600" },
            { id: "code-wizard", icon: "fa-hat-wizard", name: "Code Wizard", color: "from-pink-500 to-rose-600" },
            { id: "quantum-ai", icon: "fa-brain", name: "Quantum AI", color: "from-emerald-400 to-teal-600" },
            { id: "boss-mech", icon: "fa-dragon", name: "Boss Mech", color: "from-amber-400 to-orange-600" }
        ];

        function App() {
            const [token, setToken] = useState(localStorage.getItem('robocode_token') || '');
            const [user, setUser] = useState(null);
            const [view, setView] = useState('map'); // 'auth', 'map', 'arena', 'leaderboard', 'admin'
            const [activities, setActivities] = useState([]);
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [leaderboard, setLeaderboard] = useState([]);
            const [loading, setLoading] = useState(false);

            // Auth State
            const [authTab, setAuthTab] = useState('login');
            const [authForm, setAuthForm] = useState({ name: '', email: '', password: '', avatar: 'robot-cyber' });
            const [authError, setAuthError] = useState('');

            // Arena State
            const [userCode, setUserCode] = useState('');
            const [customInput, setCustomInput] = useState('');
            const [runOutput, setRunOutput] = useState(null);
            const [submitResults, setSubmitResults] = useState(null);
            const [levelUpModal, setLevelUpModal] = useState(null);

            // Admin State
            const [activityModal, setActivityModal] = useState(null); // null or { isEdit: bool, data: obj }
            const [testCasesModal, setTestCasesModal] = useState(null); // null or { activityId: int, testCases: [] }
            const [activityForm, setActivityForm] = useState({
                phase: 1, title: '', description: '', difficulty: 'EASY', xp_reward: 100, initial_code: '# Escreva seu código em Python aqui\n'
            });
            const [tcForm, setTcForm] = useState({ input_data: '', expected_output: '', is_hidden: false });

            useEffect(() => {
                if (token) {
                    fetchMe();
                    fetchActivities();
                } else {
                    setView('auth');
                }
            }, [token]);

            const apiFetch = async (url, options = {}, customToken = null) => {
                const headers = { 'Content-Type': 'application/json', ...options.headers };
                const authToken = customToken || token || localStorage.getItem('robocode_token');
                if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
                const res = await fetch(url, { ...options, headers });
                if (res.status === 401) {
                    logout();
                    throw new Error('Sessão expirada');
                }
                const data = await res.json();
                if (!res.ok) {
                    let msg = 'Erro na requisição';
                    if (typeof data.detail === 'string') {
                        msg = data.detail;
                    } else if (Array.isArray(data.detail)) {
                        msg = data.detail.map(d => typeof d === 'string' ? d : (d.msg || JSON.stringify(d))).join(', ');
                    } else if (data.detail && typeof data.detail === 'object') {
                        msg = data.detail.msg || JSON.stringify(data.detail);
                    }
                    throw new Error(msg);
                }
                return data;
            };

            const fetchMe = async (authToken = null) => {
                try {
                    const data = await apiFetch('/api/auth/me', {}, authToken);
                    setUser(data);
                } catch (e) {
                    console.error(e);
                }
            };

            const fetchActivities = async (authToken = null) => {
                try {
                    const data = await apiFetch('/api/activities', {}, authToken);
                    setActivities(data);
                } catch (e) {
                    console.error(e);
                }
            };

            const fetchLeaderboard = async (authToken = null) => {
                try {
                    const data = await apiFetch('/api/leaderboard', {}, authToken);
                    setLeaderboard(data);
                } catch (e) {
                    console.error(e);
                }
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                setLoading(true);
                try {
                    const endpoint = authTab === 'login' ? '/api/auth/login' : '/api/auth/register';
                    const payload = authTab === 'login' 
                        ? { email: authForm.email, password: authForm.password }
                        : authForm;
                    
                    const data = await apiFetch(endpoint, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    localStorage.setItem('robocode_token', data.access_token);
                    setToken(data.access_token);
                    setUser(data.user);
                    setView(data.user.is_admin ? 'admin' : 'map');
                    await fetchActivities(data.access_token);
                } catch (err) {
                    setAuthError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const logout = () => {
                localStorage.removeItem('robocode_token');
                setToken('');
                setUser(null);
                setView('auth');
            };

            const openActivity = async (activityId) => {
                setLoading(true);
                try {
                    const detail = await apiFetch(`/api/activities/${activityId}`);
                    setSelectedActivity(detail);
                    setUserCode(detail.initial_code);
                    setRunOutput(null);
                    setSubmitResults(null);
                    setView('arena');
                } catch (e) {
                    alert('Erro ao carregar atividade: ' + e.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleRunCode = async () => {
                setLoading(true);
                setRunOutput(null);
                try {
                    const res = await apiFetch('/api/activities/run', {
                        method: 'POST',
                        body: JSON.stringify({ code: userCode, input_data: customInput })
                    });
                    setRunOutput(res);
                } catch (e) {
                    setRunOutput({ output: '', error: e.message, execution_time_ms: 0 });
                } finally {
                    setLoading(false);
                }
            };

            const handleSubmitCode = async () => {
                setLoading(true);
                setSubmitResults(null);
                try {
                    const res = await apiFetch('/api/activities/submit', {
                        method: 'POST',
                        body: JSON.stringify({ activity_id: selectedActivity.id, code: userCode })
                    });
                    setSubmitResults(res);

                    if (res.passed) {
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                        fetchMe();
                        fetchActivities();

                        if (res.leveled_up) {
                            setLevelUpModal({ level: res.new_level, xp: res.new_xp });
                        }
                    }
                } catch (e) {
                    alert('Erro ao submeter: ' + e.message);
                } finally {
                    setLoading(false);
                }
            };

            const openLeaderboardView = () => {
                fetchLeaderboard();
                setView('leaderboard');
            };

            // ----------------------------------------------------
            // ADMIN ACTIONS
            // ----------------------------------------------------
            const openCreateActivityModal = () => {
                setActivityForm({
                    phase: activities.length + 1,
                    title: '',
                    description: '',
                    difficulty: 'EASY',
                    xp_reward: 100,
                    initial_code: '# Escreva seu código em Python aqui\n'
                });
                setActivityModal({ isEdit: false, id: null });
            };

            const openEditActivityModal = (act) => {
                setActivityForm({
                    phase: act.phase,
                    title: act.title,
                    description: act.description,
                    difficulty: act.difficulty,
                    xp_reward: act.xp_reward,
                    initial_code: act.initial_code || '# Escreva seu código em Python aqui\n'
                });
                setActivityModal({ isEdit: true, id: act.id });
            };

            const handleSaveActivity = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    if (activityModal.isEdit) {
                        await apiFetch(`/api/admin/activities/${activityModal.id}`, {
                            method: 'PUT',
                            body: JSON.stringify(activityForm)
                        });
                    } else {
                        await apiFetch('/api/admin/activities', {
                            method: 'POST',
                            body: JSON.stringify(activityForm)
                        });
                    }
                    setActivityModal(null);
                    fetchActivities();
                } catch (err) {
                    alert('Erro ao salvar atividade: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteActivity = async (activityId) => {
                if (!confirm('Tem certeza que deseja excluir esta atividade? Todo o histórico de submissões será removido.')) return;
                setLoading(true);
                try {
                    await apiFetch(`/api/admin/activities/${activityId}`, { method: 'DELETE' });
                    fetchActivities();
                } catch (err) {
                    alert('Erro ao excluir atividade: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const openManageTestCases = async (activityId) => {
                setLoading(true);
                try {
                    const detail = await apiFetch(`/api/admin/activities/${activityId}/full`);
                    setTestCasesModal({ activityId, activityTitle: detail.title, testCases: detail.test_cases });
                    setTcForm({ input_data: '', expected_output: '', is_hidden: false });
                } catch (err) {
                    alert('Erro ao carregar casos de teste: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleAddTestCase = async (e) => {
                e.preventDefault();
                if (!tcForm.expected_output.trim()) {
                    alert('A saída esperada é obrigatória!');
                    return;
                }
                setLoading(true);
                try {
                    const newTc = await apiFetch(`/api/admin/activities/${testCasesModal.activityId}/test-cases`, {
                        method: 'POST',
                        body: JSON.stringify(tcForm)
                    });
                    setTestCasesModal({
                        ...testCasesModal,
                        testCases: [...testCasesModal.testCases, newTc]
                    });
                    setTcForm({ input_data: '', expected_output: '', is_hidden: false });
                } catch (err) {
                    alert('Erro ao adicionar caso de teste: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteTestCase = async (tcId) => {
                setLoading(true);
                try {
                    await apiFetch(`/api/admin/test-cases/${tcId}`, { method: 'DELETE' });
                    setTestCasesModal({
                        ...testCasesModal,
                        testCases: testCasesModal.testCases.filter(t => t.id !== tcId)
                    });
                } catch (err) {
                    alert('Erro ao remover caso de teste: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const getAvatarInfo = (avatarId) => AVATARS.find(a => a.id === avatarId) || AVATARS[0];

            return (
                <div class="flex flex-col min-h-screen">
                    {/* HUD / HEADER */}
                    <header class="bg-cyber-card border-b border-cyber-border sticky top-0 z-40 px-6 py-3 shadow-lg flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-3 cursor-pointer" onClick={() => user ? setView('map') : setView('auth')}>
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center text-white text-xl shadow-lg neon-border">
                                <i class="fa-solid fa-robot"></i>
                            </div>
                            <div>
                                <h1 class="text-lg font-black tracking-wider text-cyan-400 font-mono">ROBO<span class="text-purple-400">CODE</span></h1>
                                <p class="text-xs text-gray-400">Challenge Arena Python</p>
                            </div>
                        </div>

                        {user && (
                            <div class="flex items-center gap-6">
                                {/* HUD STATUS DO ALUNO OU BADGE ADMIN */}
                                <div class="hidden sm:flex items-center gap-4 bg-cyber-bg px-4 py-2 rounded-xl border border-cyber-border">
                                    <div class="flex items-center gap-2">
                                        <div class={`w-8 h-8 rounded-lg bg-gradient-to-br ${getAvatarInfo(user.avatar).color} flex items-center justify-center text-white text-sm`}>
                                            <i class={`fa-solid ${getAvatarInfo(user.avatar).icon}`}></i>
                                        </div>
                                        <div>
                                            <div class="flex items-center gap-2">
                                                <p class="text-xs font-bold text-gray-200">{user.name}</p>
                                                {user.is_admin && (
                                                    <span class="text-[9px] bg-red-500/20 text-red-400 font-black px-1.5 py-0.5 rounded border border-red-500/40 uppercase">
                                                        ADMIN
                                                    </span>
                                                )}
                                            </div>
                                            <div class="flex items-center gap-1">
                                                <span class="text-[10px] bg-purple-900/60 text-purple-300 font-bold px-1.5 py-0.5 rounded border border-purple-500/40">
                                                    Nível {user.level}
                                                </span>
                                                <span class="text-xs text-yellow-400 font-mono font-bold">
                                                    <i class="fa-solid fa-bolt text-yellow-400 mr-1"></i>{user.xp} XP
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* NAVEGAÇÃO */}
                                <div class="flex items-center gap-2">
                                    <button 
                                        onClick={() => setView('map')}
                                        class={`px-3 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 ${view === 'map' ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/40' : 'text-gray-400 hover:text-white'}`}
                                    >
                                        <i class="fa-solid fa-map"></i> Mapa
                                    </button>
                                    <button 
                                        onClick={openLeaderboardView}
                                        class={`px-3 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 ${view === 'leaderboard' ? 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/40' : 'text-gray-400 hover:text-white'}`}
                                    >
                                        <i class="fa-solid fa-trophy text-yellow-400"></i> Ranking
                                    </button>

                                    {/* BOTÃO DO PAINEL DE ADMINISTRADOR */}
                                    {user.is_admin && (
                                        <button 
                                            onClick={() => setView('admin')}
                                            class={`px-3 py-1.5 rounded-lg text-sm font-bold transition-all flex items-center gap-2 ${view === 'admin' ? 'bg-red-500/20 text-red-400 border border-red-500/40 shadow-md' : 'text-red-400 hover:bg-red-500/10'}`}
                                        >
                                            <i class="fa-solid fa-user-gear"></i> Painel Admin
                                        </button>
                                    )}

                                    <button 
                                        onClick={logout}
                                        class="px-3 py-1.5 rounded-lg text-sm font-semibold text-gray-400 hover:text-red-400 hover:bg-red-500/10 transition-all"
                                        title="Sair"
                                    >
                                        <i class="fa-solid fa-right-from-bracket"></i>
                                    </button>
                                </div>
                            </div>
                        )}
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main class="flex-grow flex flex-col">
                        {/* 1. TELA DE AUTENTICAÇÃO */}
                        {view === 'auth' && (
                            <div class="flex-grow flex items-center justify-center p-6">
                                <div class="w-full max-w-md bg-cyber-card border border-cyber-border rounded-2xl p-8 shadow-2xl neon-border-purple relative overflow-hidden">
                                    <div class="text-center mb-6">
                                        <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-400 via-purple-500 to-pink-500 p-0.5 shadow-xl mb-3">
                                            <div class="w-full h-full bg-cyber-bg rounded-2xl flex items-center justify-center text-cyan-400 text-3xl">
                                                <i class="fa-solid fa-gamepad"></i>
                                            </div>
                                        </div>
                                        <h2 class="text-2xl font-black tracking-wider text-white">ENTRAR NA ARENA</h2>
                                        <p class="text-sm text-gray-400 mt-1">Desenvolva suas habilidades Python e suba de fase!</p>
                                    </div>

                                    {/* TABS LOGIN / CADASTRO */}
                                    <div class="flex bg-cyber-bg p-1 rounded-xl mb-6 border border-cyber-border">
                                        <button 
                                            class={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${authTab === 'login' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-gray-400 hover:text-white'}`}
                                            onClick={() => setAuthTab('login')}
                                        >
                                            LOGIN
                                        </button>
                                        <button 
                                            class={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${authTab === 'register' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-gray-400 hover:text-white'}`}
                                            onClick={() => setAuthTab('register')}
                                        >
                                            CADASTRAR
                                        </button>
                                    </div>

                                    {authError && (
                                        <div class="mb-4 p-3 bg-red-500/10 border border-red-500/40 text-red-400 rounded-xl text-xs font-semibold flex items-center gap-2">
                                            <i class="fa-solid fa-triangle-exclamation"></i>
                                            <span>{authError}</span>
                                        </div>
                                    )}

                                    <form onSubmit={handleAuth} class="space-y-4">
                                        {authTab === 'register' && (
                                            <div>
                                                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Nome do Aluno</label>
                                                <div class="relative">
                                                    <i class="fa-solid fa-user absolute left-3 top-3.5 text-gray-500 text-sm"></i>
                                                    <input 
                                                        type="text" 
                                                        required 
                                                        placeholder="Seu nome ou Nickname" 
                                                        class="w-full bg-cyber-bg border border-cyber-border rounded-xl pl-9 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition-colors"
                                                        value={authForm.name}
                                                        onChange={e => setAuthForm({...authForm, name: e.target.value})}
                                                    />
                                                </div>
                                            </div>
                                        )}

                                        <div>
                                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">E-mail</label>
                                            <div class="relative">
                                                <i class="fa-solid fa-envelope absolute left-3 top-3.5 text-gray-500 text-sm"></i>
                                                <input 
                                                    type="email" 
                                                    required 
                                                    placeholder="aluno@email.com" 
                                                    class="w-full bg-cyber-bg border border-cyber-border rounded-xl pl-9 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition-colors"
                                                    value={authForm.email}
                                                    onChange={e => setAuthForm({...authForm, email: e.target.value})}
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Senha</label>
                                            <div class="relative">
                                                <i class="fa-solid fa-lock absolute left-3 top-3.5 text-gray-500 text-sm"></i>
                                                <input 
                                                    type="password" 
                                                    required 
                                                    placeholder="••••••••" 
                                                    class="w-full bg-cyber-bg border border-cyber-border rounded-xl pl-9 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition-colors"
                                                    value={authForm.password}
                                                    onChange={e => setAuthForm({...authForm, password: e.target.value})}
                                                />
                                            </div>
                                        </div>

                                        {authTab === 'register' && (
                                            <div>
                                                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Escolha seu Avatar</label>
                                                <div class="grid grid-cols-5 gap-2">
                                                    {AVATARS.map(av => (
                                                        <button
                                                            key={av.id}
                                                            type="button"
                                                            onClick={() => setAuthForm({...authForm, avatar: av.id})}
                                                            class={`h-12 rounded-xl border flex items-center justify-center text-lg transition-all ${authForm.avatar === av.id ? 'border-cyan-400 bg-cyan-500/20 text-cyan-300 scale-105 shadow-md' : 'border-cyber-border bg-cyber-bg text-gray-500 hover:text-gray-300'}`}
                                                            title={av.name}
                                                        >
                                                            <i class={`fa-solid ${av.icon}`}></i>
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        <button 
                                            type="submit" 
                                            disabled={loading}
                                            class="w-full py-3 bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 font-black rounded-xl hover:opacity-90 transition-opacity shadow-lg neon-border mt-2 flex items-center justify-center gap-2"
                                        >
                                            {loading ? <i class="fa-solid fa-circle-notch fa-spin"></i> : (authTab === 'login' ? 'INICIAR JOGO' : 'CRIAR MINHA CONTA')}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* 2. MAPA DE FASES (ALUNO) */}
                        {view === 'map' && user && (
                            <div class="max-w-5xl w-full mx-auto p-6 flex flex-col gap-8">
                                <div class="bg-gradient-to-r from-cyber-card via-purple-950/40 to-cyber-card border border-cyber-border rounded-2xl p-6 relative overflow-hidden flex flex-wrap items-center justify-between gap-6 shadow-xl">
                                    <div class="space-y-2 z-10">
                                        <div class="inline-flex items-center gap-2 bg-cyan-500/10 border border-cyan-500/30 px-3 py-1 rounded-full text-xs font-bold text-cyan-400">

                                                                ? 'border-cyan-500/40 hover:border-cyan-400 hover:shadow-lg cursor-pointer'

                                                                    : isUnlocked 
                                                                        ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/40'

                                                                        act.difficulty === 'BOSS' ? 'bg-red-950/60 text-red-400 border-red-500/40' :
                                                                        act.difficulty === 'HARD' ? 'bg-orange-950/60 text-orange-400 border-orange-500/40' :
                                                                        act.difficulty === 'MEDIUM' ? 'bg-yellow-950/60 text-yellow-400 border-yellow-500/40' :
                                                                        'bg-blue-950/60 text-blue-400 border-blue-500/40'

                                                                        {act.difficulty}
                                                                    </span>
                                                                    <span class="text-xs text-yellow-400 font-mono font-bold">

                                                            disabled={!isUnlocked}

                                                                act.completed 
                                                                    ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 hover:bg-emerald-500/30' 
                                                                    : isUnlocked 
                                                                        ? 'bg-cyan-400 text-slate-950 hover:bg-cyan-300 font-black' 
                                                                        : 'bg-gray-800 text-gray-500 cursor-not-allowed'
                                                            }`}
                                                        >
                                                            {act.completed ? 'REJOGAR' : (isUnlocked ? 'JOGAR FASE' : 'BLOQUEADO')}
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. ARENA DE CÓDIGO (IDE INTERATIVA) */}
                        {view === 'arena' && selectedActivity && (
                            <div class="flex-grow flex flex-col md:flex-row max-h-[calc(100vh-65px)]">
                                <div class="w-full md:w-5/12 bg-cyber-card border-r border-cyber-border p-6 flex flex-col overflow-y-auto custom-scrollbar">

                                            onClick={() => setView('map')}

                                            <i class="fa-solid fa-arrow-left"></i> Voltar ao Mapa
                                        </button>

                                            Fase {selectedActivity.phase}
                                        </span>
                                    </div>

                                    <div class="flex items-center gap-3 mb-6">
                                        <span class="text-xs text-yellow-400 font-mono font-bold bg-yellow-950/40 border border-yellow-500/40 px-2 py-0.5 rounded">
                                            <i class="fa-solid fa-bolt mr-1"></i>Recompensa: +{selectedActivity.xp_reward} XP
                                        </span>
                                        <span class="text-xs text-gray-400 font-mono">Dificuldade: {selectedActivity.difficulty}</span>
                                    </div>

                                    <div class="prose prose-invert max-w-none text-sm text-gray-300 space-y-3 mb-6 bg-cyber-bg p-4 rounded-xl border border-cyber-border">
                                        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Descrição do Desafio</h4>
                                        <div class="whitespace-pre-line">{selectedActivity.description}</div>
                                    </div>

                                    {selectedActivity.test_cases && selectedActivity.test_cases.length > 0 && (
                                        <div class="mb-6">
                                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Exemplos de Teste</h4>
                                            <div class="space-y-3">
                                                {selectedActivity.test_cases.map((tc, idx) => (
                                                    <div key={tc.id} class="bg-cyber-bg rounded-xl p-3 border border-cyber-border text-xs font-mono">
                                                        <p class="text-gray-500 font-bold mb-1">Exemplo {idx + 1}:</p>

                                                            <div class="mb-1">
                                                                <span class="text-cyan-400">Entrada:</span> <span class="text-gray-200">{tc.input_data}</span>
                                                            </div>
                                                        )}

                                                            <span class="text-emerald-400">Saída Esperada:</span> <span class="text-gray-200">{tc.expected_output}</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Entrada Personalizada (stdin)</label>

                                            rows="2"
                                            placeholder="Digite aqui valores para testar com input()..."
                                            class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-3 text-xs text-white font-mono focus:outline-none focus:border-cyan-400"
                                            value={customInput}
                                            onChange={e => setCustomInput(e.target.value)}
                                        ></textarea>
                                    </div>
                                </div>

                                <div class="w-full md:w-7/12 flex flex-col bg-cyber-bg">

                                        <div class="flex items-center gap-2 text-cyan-400 font-mono font-bold">
                                            <i class="fa-brands fa-python text-lg"></i> solution.py
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <button 
                                                onClick={handleRunCode}
                                                disabled={loading}
                                                class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-white rounded-lg font-bold flex items-center gap-1.5 border border-gray-700 transition-all"
                                            >
                                                <i class="fa-solid fa-play text-cyan-400"></i> Testar Execução
                                            </button>
                                            <button 
                                                onClick={handleSubmitCode}
                                                disabled={loading}
                                                class="px-4 py-1.5 bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 rounded-lg font-black flex items-center gap-1.5 shadow-md hover:opacity-90 transition-opacity"
                                            >
                                                {loading ? <i class="fa-solid fa-circle-notch fa-spin"></i> : <i class="fa-solid fa-bolt"></i>} SUBMETER CÓDIGO
                                            </button>
                                        </div>
                                    </div>

                                    <div class="flex-grow relative border-b border-cyber-border">
                                        <textarea
                                            class="w-full h-full p-4 bg-cyber-bg text-cyan-300 font-mono text-sm border-none focus:outline-none resize-none"
                                            value={userCode}
                                            onChange={e => setUserCode(e.target.value)}
                                            placeholder="# Digite seu código Python aqui..."
                                        ></textarea>
                                    </div>

                                    <div class="h-56 bg-cyber-card p-4 overflow-y-auto custom-scrollbar flex flex-col">
                                        <div class="flex items-center justify-between mb-2">
                                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-1.5 font-mono">
                                                <i class="fa-solid fa-terminal text-purple-400"></i> Terminal de Saída
                                            </span>
                                            {runOutput && (
                                                <span class="text-[10px] text-gray-500 font-mono">
                                                    Tempo: {runOutput.execution_time_ms} ms
                                                </span>
                                            )}
                                        </div>

                                        {submitResults && (
                                            <div class={`p-3 rounded-xl mb-3 border text-xs font-mono ${submitResults.passed ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-300' : 'bg-red-950/40 border-red-500/50 text-red-300'}`}>

                                                    {submitResults.passed ? <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i> : <i class="fa-solid fa-circle-xmark text-red-400 text-sm"></i>}

                                                    <pre class="text-cyan-300 whitespace-pre-wrap">{runOutput.output || '(Nenhuma saída gerada)'}</pre>
                                                )}

                                        {!runOutput && !submitResults && (
                                            <p class="text-xs text-gray-600 font-mono my-auto text-center">

                                            </p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                            <div class="max-w-4xl w-full mx-auto p-6 flex flex-col gap-6">

                                    <div class="inline-flex items-center gap-2 bg-yellow-500/10 border border-yellow-500/30 px-3 py-1 rounded-full text-xs font-bold text-yellow-400">
                                        <i class="fa-solid fa-crown"></i> HALL DA FAMA ROBOCODE
                                    </div>
                                    <h2 class="text-3xl font-black text-white">RANKING DE ALUNOS</h2>
                                    <p class="text-sm text-gray-400">Os programadores com maior pontuação e nível na arena</p>
                                </div>

                                {leaderboard.length >= 3 && (
                                    <div class="grid grid-cols-3 gap-4 items-end my-4 max-w-2xl mx-auto w-full">
                                        <div class="bg-cyber-card border border-gray-400/40 rounded-2xl p-4 text-center flex flex-col items-center shadow-lg relative">
                                            <span class="absolute -top-3 w-7 h-7 rounded-full bg-gray-300 text-slate-950 font-black text-xs flex items-center justify-center shadow">2</span>
                                            <div class={`w-12 h-12 rounded-xl bg-gradient-to-br ${getAvatarInfo(leaderboard[1].avatar).color} flex items-center justify-center text-white text-xl my-2`}>
                                                <i class={`fa-solid ${getAvatarInfo(leaderboard[1].avatar).icon}`}></i>
                                            </div>
                                            <p class="font-bold text-sm text-white truncate w-full">{leaderboard[1].name}</p>
                                            <p class="text-xs text-yellow-400 font-mono font-bold mt-1">{leaderboard[1].xp} XP</p>
                                        </div>

                                        <div class="bg-gradient-to-b from-yellow-950/40 to-cyber-card border border-yellow-500/60 rounded-2xl p-5 text-center flex flex-col items-center shadow-2xl relative transform -translate-y-2 neon-border">
                                            <span class="absolute -top-4 w-9 h-9 rounded-full bg-yellow-400 text-slate-950 font-black text-sm flex items-center justify-center shadow-lg">
                                                <i class="fa-solid fa-crown text-slate-950"></i>
                                            </span>
                                            <div class={`w-14 h-14 rounded-2xl bg-gradient-to-br ${getAvatarInfo(leaderboard[0].avatar).color} flex items-center justify-center text-white text-2xl my-2 shadow-xl`}>
                                                <i class={`fa-solid ${getAvatarInfo(leaderboard[0].avatar).icon}`}></i>
                                            </div>
                                            <p class="font-black text-base text-yellow-300 truncate w-full">{leaderboard[0].name}</p>

                                        </div>

                                        <div class="bg-cyber-card border border-amber-600/40 rounded-2xl p-4 text-center flex flex-col items-center shadow-lg relative">
                                            <span class="absolute -top-3 w-7 h-7 rounded-full bg-amber-600 text-white font-black text-xs flex items-center justify-center shadow">3</span>
                                            <div class={`w-12 h-12 rounded-xl bg-gradient-to-br ${getAvatarInfo(leaderboard[2].avatar).color} flex items-center justify-center text-white text-xl my-2`}>
                                                <i class={`fa-solid ${getAvatarInfo(leaderboard[2].avatar).icon}`}></i>
                                            </div>
                                            <p class="font-bold text-sm text-white truncate w-full">{leaderboard[2].name}</p>
                                            <p class="text-xs text-yellow-400 font-mono font-bold mt-1">{leaderboard[2].xp} XP</p>
                                        </div>
                                    </div>
                                )}

                                                <th class="py-3 px-4 text-center">Pos</th>
                                                <th class="py-3 px-4">Aluno</th>
                                                <th class="py-3 px-4 text-center">Nível</th>
                                                <th class="py-3 px-4 text-center">Desafios Feitos</th>
                                                <th class="py-3 px-4 text-right">Pontuação</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-cyber-border text-sm">
                                            {leaderboard.map((entry) => {
                                                const isCurrentUser = user && entry.user_id === user.id;
                                                return (
                                                    <tr key={entry.user_id} class={`transition-colors ${isCurrentUser ? 'bg-cyan-500/10 font-bold border-l-4 border-cyan-400' : 'hover:bg-cyber-bg/50'}`}>
                                                        <td class="py-3 px-4 text-center font-mono font-bold text-gray-400">
                                                            {entry.rank === 1 ? <i class="fa-solid fa-trophy text-yellow-400"></i> :
                                                             entry.rank === 2 ? <i class="fa-solid fa-trophy text-gray-300"></i> :
                                                             entry.rank === 3 ? <i class="fa-solid fa-trophy text-amber-600"></i> :
                                                             `#${entry.rank}`}
                                                        </td>
                                                        <td class="py-3 px-4 flex items-center gap-3">
                                                            <div class={`w-8 h-8 rounded-lg bg-gradient-to-br ${getAvatarInfo(entry.avatar).color} flex items-center justify-center text-white text-xs`}>

                                                            <span class={isCurrentUser ? 'text-cyan-400' : 'text-white'}>{entry.name}</span>

                                                            <i class="fa-solid fa-bolt text-yellow-400 mr-1"></i>{entry.xp} XP
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        {/* 5. PAINEL DE ADMINISTRADOR */}

                                    <button 
                                        onClick={openCreateActivityModal}
                                        class="px-5 py-2.5 bg-gradient-to-r from-red-500 to-rose-600 text-white font-bold rounded-xl shadow-lg hover:opacity-90 transition-opacity flex items-center gap-2 text-sm"

                                </div>

                                    <table class="w-full text-left border-collapse">
                                        <thead>
                                            <tr class="bg-cyber-bg border-b border-cyber-border text-xs text-gray-400 uppercase font-mono">
                                                <th class="py-3 px-4 text-center">Fase</th>
                                                <th class="py-3 px-4">Título da Atividade</th>
                                                <th class="py-3 px-4 text-center">Dificuldade</th>
                                                <th class="py-3 px-4 text-center">Pontuação (XP)</th>
                                                <th class="py-3 px-4 text-right">Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-cyber-border text-sm">
                                            {activities.map((act) => (
                                                <tr key={act.id} class="hover:bg-cyber-bg/50 transition-colors">
                                                    <td class="py-3 px-4 text-center font-mono font-bold text-cyan-400">
                                                        Fase {act.phase}
                                                    </td>
                                                    <td class="py-3 px-4 font-bold text-white">
                                                        {act.title}
                                                    </td>
                                                    <td class="py-3 px-4 text-center font-mono">
                                                        <span class={`text-[10px] font-bold px-2 py-0.5 rounded border ${
                                                            act.difficulty === 'BOSS' ? 'bg-red-950/60 text-red-400 border-red-500/40' :
                                                            act.difficulty === 'HARD' ? 'bg-orange-950/60 text-orange-400 border-orange-500/40' :
                                                            act.difficulty === 'MEDIUM' ? 'bg-yellow-950/60 text-yellow-400 border-yellow-500/40' :
                                                            'bg-blue-950/60 text-blue-400 border-blue-500/40'

                                                            {act.difficulty}
                                                        </span>

                                                    </td>

                                                        <button 
                                                            onClick={() => openManageTestCases(act.id)}

                                                        >
                                                            <i class="fa-solid fa-list-check mr-1"></i> Testes

                                                        >
                                                            <i class="fa-solid fa-pen-to-square mr-1"></i> Editar
                                                        </button>
                                                        <button 
                                                            onClick={() => handleDeleteActivity(act.id)}
                                                            class="px-3 py-1 bg-red-500/20 text-red-400 hover:bg-red-500/30 border border-red-500/40 rounded-lg text-xs font-bold transition-all"
                                                            title="Excluir Atividade"

                                                            <i class="fa-solid fa-trash mr-1"></i> Excluir
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL CRIAR / EDITAR ATIVIDADE (ADMIN) */}
                    {activityModal && (
                        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div class="bg-cyber-card border border-cyber-border rounded-2xl p-6 max-w-xl w-full shadow-2xl overflow-y-auto max-h-[90vh] custom-scrollbar">
                                <div class="flex items-center justify-between mb-4 pb-3 border-b border-cyber-border">
                                    <h3 class="text-lg font-black text-white flex items-center gap-2">
                                        <i class="fa-solid fa-pen-to-square text-cyan-400"></i>
                                        {activityModal.isEdit ? 'Editar Atividade / Pontuação' : 'Nova Atividade'}
                                    </h3>
                                    <button onClick={() => setActivityModal(null)} class="text-gray-400 hover:text-white">
                                        <i class="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveActivity} class="space-y-4">
                                    <div class="grid grid-cols-3 gap-4">
                                        <div>
                                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Fase N°</label>
                                            <input 
                                                type="number" 
                                                required 
                                                min="1"
                                                class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-sm text-white font-mono"
                                                value={activityForm.phase}
                                                onChange={e => setActivityForm({...activityForm, phase: parseInt(e.target.value)})}
                                            />
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Pontuação (XP)</label>
                                            <input 
                                                type="number" 
                                                required 
                                                min="10"
                                                step="10"
                                                class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-sm text-yellow-400 font-mono font-bold"
                                                value={activityForm.xp_reward}
                                                onChange={e => setActivityForm({...activityForm, xp_reward: parseInt(e.target.value)})}
                                            />
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Dificuldade</label>
                                            <select 
                                                class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-sm text-white font-mono"
                                                value={activityForm.difficulty}
                                                onChange={e => setActivityForm({...activityForm, difficulty: e.target.value})}
                                            >
                                                <option value="EASY">EASY</option>
                                                <option value="MEDIUM">MEDIUM</option>
                                                <option value="HARD">HARD</option>
                                                <option value="BOSS">BOSS</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Título da Atividade</label>
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="Ex: Fase 1: Hello World Python"
                                            class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-2.5 text-sm text-white"
                                            value={activityForm.title}
                                            onChange={e => setActivityForm({...activityForm, title: e.target.value})}
                                        />
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Enunciado / Instruções</label>
                                        <textarea 
                                            rows="4" 
                                            required 
                                            placeholder="Descreva o objetivo da atividade e o que o aluno deve fazer..."
                                            class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-3 text-xs text-white"
                                            value={activityForm.description}
                                            onChange={e => setActivityForm({...activityForm, description: e.target.value})}
                                        ></textarea>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Código Modelo / Inicial (Python)</label>
                                        <textarea 
                                            rows="3" 
                                            class="w-full bg-cyber-bg border border-cyber-border rounded-xl p-3 text-xs text-cyan-300 font-mono"
                                            value={activityForm.initial_code}
                                            onChange={e => setActivityForm({...activityForm, initial_code: e.target.value})}
                                        ></textarea>
                                    </div>

                                    <div class="flex items-center justify-end gap-3 pt-3 border-t border-cyber-border">
                                        <button 
                                            type="button" 
                                            onClick={() => setActivityModal(null)}
                                            class="px-4 py-2 bg-gray-800 text-gray-400 rounded-xl text-sm font-bold hover:text-white"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit" 
                                            disabled={loading}
                                            class="px-5 py-2 bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 font-black rounded-xl text-sm shadow-md"
                                        >
                                            {loading ? <i class="fa-solid fa-circle-notch fa-spin"></i> : 'SALVAR ATIVIDADE'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL GERENCIAR CASOS DE TESTE (ADMIN) */}
                    {testCasesModal && (
                        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div class="bg-cyber-card border border-cyber-border rounded-2xl p-6 max-w-2xl w-full shadow-2xl overflow-y-auto max-h-[90vh] custom-scrollbar">
                                <div class="flex items-center justify-between mb-4 pb-3 border-b border-cyber-border">
                                    <div>
                                        <h3 class="text-lg font-black text-white flex items-center gap-2">
                                            <i class="fa-solid fa-list-check text-purple-400"></i> Casos de Teste
                                        </h3>
                                        <p class="text-xs text-gray-400">{testCasesModal.activityTitle}</p>
                                    </div>
                                    <button onClick={() => setTestCasesModal(null)} class="text-gray-400 hover:text-white">
                                        <i class="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {/* LISTA DE CASOS ATUAIS */}
                                <div class="mb-6 space-y-3">
                                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Testes Cadastrados ({testCasesModal.testCases.length})</h4>
                                    {testCasesModal.testCases.length === 0 ? (
                                        <p class="text-xs text-gray-500 italic p-3 bg-cyber-bg rounded-xl text-center">Nenhum caso de teste cadastrado para esta atividade.</p>
                                    ) : (
                                        testCasesModal.testCases.map((tc, idx) => (
                                            <div key={tc.id} class="bg-cyber-bg p-3 rounded-xl border border-cyber-border text-xs font-mono flex items-center justify-between gap-4">
                                                <div class="space-y-1">
                                                    <div class="flex items-center gap-2">
                                                        <span class="font-bold text-purple-400">Teste #{idx + 1}</span>
                                                        {tc.is_hidden && (
                                                            <span class="text-[9px] bg-yellow-950/60 text-yellow-400 border border-yellow-500/40 px-1.5 py-0.5 rounded font-bold">
                                                                OCULTO PARA ALUNOS
                                                            </span>
                                                        )}
                                                    </div>
                                                    {tc.input_data && (
                                                        <div><span class="text-cyan-400">Entrada (stdin):</span> {tc.input_data}</div>
                                                    )}
                                                    <div><span class="text-emerald-400">Saída Esperada (stdout):</span> {tc.expected_output}</div>
                                                </div>
                                                <button 
                                                    onClick={() => handleDeleteTestCase(tc.id)}
                                                    class="text-red-400 hover:text-red-300 p-2"
                                                    title="Excluir Teste"
                                                >
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {/* FORMULARIO DE NOVO TESTE */}
                                <form onSubmit={handleAddTestCase} class="bg-cyber-bg p-4 rounded-xl border border-cyber-border space-y-3">
                                    <h4 class="text-xs font-bold text-gray-300 uppercase tracking-wider">Adicionar Novo Caso de Teste</h4>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Entrada (stdin) - Opcional</label>
                                            <textarea 
                                                rows="2" 
                                                placeholder="Valores lidos por input()..."
                                                class="w-full bg-cyber-card border border-cyber-border rounded-lg p-2 text-xs text-white font-mono"
                                                value={tcForm.input_data}
                                                onChange={e => setTcForm({...tcForm, input_data: e.target.value})}
                                            ></textarea>
                                        </div>

                                        <div>
                                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Saída Esperada (stdout) - Obrigatório</label>
                                            <textarea 
                                                rows="2" 
                                                required
                                                placeholder="Exatamente o que deve ser impresso no print()..."
                                                class="w-full bg-cyber-card border border-cyber-border rounded-lg p-2 text-xs text-emerald-400 font-mono"
                                                value={tcForm.expected_output}
                                                onChange={e => setTcForm({...tcForm, expected_output: e.target.value})}
                                            ></textarea>
                                        </div>
                                    </div>

                                    <div class="flex items-center justify-between pt-2">
                                        <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                class="rounded bg-cyber-card border-cyber-border text-purple-500 focus:ring-0"
                                                checked={tcForm.is_hidden}
                                                onChange={e => setTcForm({...tcForm, is_hidden: e.target.checked})}
                                            />
                                            <span>Ocultar este caso de teste dos alunos?</span>
                                        </label>

                                        <button 
                                            type="submit" 
                                            disabled={loading}
                                            class="px-4 py-1.5 bg-purple-500 text-white font-bold rounded-lg text-xs hover:bg-purple-600 transition-colors shadow-md"
                                        >
                                            {loading ? <i class="fa-solid fa-circle-notch fa-spin"></i> : '+ ADICIONAR TESTE'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL LEVEL UP */}
                    {levelUpModal && (
                        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div class="bg-cyber-card border-2 border-yellow-400 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl neon-border relative overflow-hidden transform animate-bounce-short">
                                <div class="w-20 h-20 bg-gradient-to-tr from-yellow-400 to-amber-600 rounded-full mx-auto flex items-center justify-center text-slate-950 text-4xl shadow-xl mb-4">
                                    <i class="fa-solid fa-angles-up"></i>
                                </div>
                                <h3 class="text-3xl font-black text-yellow-400 tracking-wider font-mono">LEVEL UP!</h3>
                                <p class="text-gray-300 text-sm mt-2">Você subiu para o <strong class="text-white font-mono">Nível {levelUpModal.level}</strong>!</p>
                                <div class="my-4 py-2 bg-cyber-bg rounded-xl border border-cyber-border font-mono text-yellow-400 font-bold text-lg">
                                    <i class="fa-solid fa-bolt mr-2"></i>{levelUpModal.xp} XP Total
                                </div>
                                <button 
                                    onClick={() => setLevelUpModal(null)}
                                    class="w-full py-3 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-black rounded-xl hover:opacity-90 transition-opacity shadow-lg"
                                >
                                    CONTINUAR JOGANDO
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
