version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: robocode_postgres
    restart: always
    environment:
      POSTGRES_USER: robocode
      POSTGRES_PASSWORD: robocode_secret_pass
      POSTGRES_DB: robocode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: robocode_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@robocode.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
